<div class="col-lg-4 mb-4">
    <div class="card person-card">
        <div class="card-header">
            <h5 class="mb-0" th:text="${person.name}">Nombre</h5>
        </div>
        <div class="card-body">
            <p class="text-muted mb-3">Detalles de la persona.</p>
            <a th:href="@{/person/{id}(id=${person.id})}" class="btn btn-sm btn-primary">Ver detalles</a>
        </div>
    </div>
</div>
