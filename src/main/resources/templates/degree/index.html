<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header d-flex justify-content-between align-items-center">
            <h2>Titulos</h2>
            <a th:href="@{/degrees/form}" class="btn btn-success">+ Nuevo Titulo</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Institucion</th>
                                <th>Anio</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="degree : ${degrees}">
                                <td th:text="${degree.name}"></td>
                                <td th:text="${degree.institution}"></td>
                                <td th:text="${degree.year}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${degrees == null or degrees.isEmpty()}" class="text-center text-muted py-4">
                    No hay titulos registrados.
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
